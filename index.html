<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MarTech Tracking Lab</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>Diagnóstico de Marketing</h1>

    <p>
      Descubra onde seu funil pode estar perdendo oportunidades.
    </p>

    <a
      id="whatsapp-btn"
      class="button whatsapp"
      href="https://wa.me/5500000000000"
      target="_blank"
    >
      Falar pelo WhatsApp
    </a>

    <hr>

    <h2>Solicite um diagnóstico</h2>

    <form id="lead-form">

      <label for="name">Nome</label>
      <input
        type="text"
        id="name"
        name="name"
        required
      >

      <label for="phone">WhatsApp</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        required
      >

      <label for="company">Empresa</label>
      <input
        type="text"
        id="company"
        name="company"
        required
      >

      <button type="submit">
        Solicitar diagnóstico
      </button>

    </form>

    <p id="form-message"></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
